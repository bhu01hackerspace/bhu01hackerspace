<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg { fill: #000000; }

    .text {
      font-family: 'Courier New', monospace;
      font-size: 52px;
      fill: #00ff99;
      letter-spacing: 3px;
    }

    .glitch1 {
      fill: #00ffcc;
      opacity: 0.7;
      animation: glitch1 1.5s infinite;
    }

    .glitch2 {
      fill: #00ffaa;
      opacity: 0.5;
      animation: glitch2 1.2s infinite;
    }

    @keyframes glitch1 {
      0% { transform: translate(0,0); }
      20% { transform: translate(-2px,1px); }
      40% { transform: translate(2px,-1px); }
      60% { transform: translate(-1px,2px); }
      80% { transform: translate(1px,-2px); }
      100% { transform: translate(0,0); }
    }

    @keyframes glitch2 {
      0% { transform: translate(0,0); }
      25% { transform: translate(2px,2px); }
      50% { transform: translate(-2px,-1px); }
      75% { transform: translate(1px,1px); }
      100% { transform: translate(0,0); }
    }

    .scanline {
      stroke: #00ff99;
      stroke-width: 1;
      opacity: 0.2;
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(-140px); }
      100% { transform: translateY(140px); }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Scanline -->
  <line x1="0" y1="0" x2="900" y2="0" class="scanline"/>

  <!-- Hat icon -->
  <g transform="translate(40,35)">
    <path d="M20 10 Q40 0 60 10 L55 30 Q40 35 25 30 Z" fill="#00ff99"/>
    <rect x="10" y="30" width="60" height="8" rx="4" fill="#00ff99"/>
  </g>

  <!-- Glitch layers -->
  <text x="140" y="85" class="text glitch1">HACKER SOCIETY_</text>
  <text x="140" y="85" class="text glitch2">HACKER SOCIETY_</text>

  <!-- Main text -->
  <text x="140" y="85" class="text">HACKER SOCIETY_</text>

</svg>
